```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal To-Do List</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-r from-blue-400 via-purple-100 to-pink-400 p-1">

    <div
        class="max-w-3xl mx-auto mt-10 bg-gradient-to-br from-blue-100 via-purple-50 to-pink-200 rounded-3xl shadow-xl p-6 sm:p-9">

        <h1 class="text-3xl sm:text-4xl font-bold text-center text-purple-700 mb-3">
            My To-Do List
        </h1>

        <p class="text-center text-gray-500 text-lg sm:text-xl mb-8">
            Plan your day and complete your tasks!
        </p>

        <!-- Task Input -->
        <div class="flex flex-col gap-3 mb-4">

            <input type="text" id="taskInput" placeholder="Enter your task..."
                class="w-full p-4 text-lg border border-purple-200 rounded-xl outline-none focus:ring-2 focus:ring-purple-400 bg-white/70">

            <button onclick="addTask()"
                class="w-full bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-700 hover:to-indigo-800 text-white text-xl py-4 rounded-xl transition">
                Add Task
            </button>

        </div>

        <p id="message" class="text-red-500 text-sm mb-3"></p>

        <!-- Task Counters -->
        <div class="grid grid-cols-3 gap-2 sm:gap-3 mb-8 text-center">

            <div class="bg-gradient-to-r from-blue-200 to-cyan-100 rounded-xl p-3 sm:p-5">
                <p id="total" class="text-2xl font-bold text-blue-700">0</p>
                <p class="text-sm sm:text-base text-gray-600">Total</p>
            </div>

            <div class="bg-gradient-to-r from-orange-200 to-yellow-100 rounded-xl p-3 sm:p-5">
                <p id="pending" class="text-2xl font-bold text-orange-600">0</p>
                <p class="text-sm sm:text-base text-gray-600">Pending</p>
            </div>

            <div class="bg-gradient-to-r from-green-200 to-teal-100 rounded-xl p-3 sm:p-5">
                <p id="completed" class="text-2xl font-bold text-green-700">0</p>
                <p class="text-sm sm:text-base text-gray-600">Completed</p>
            </div>

        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3"></ul>

        <p id="emptyMessage" class="text-center text-gray-400 text-lg py-8">
            No tasks added yet!
        </p>

        <!-- Clear Completed Button -->
        <button onclick="clearCompleted()"
            class="w-full mt-4 bg-gradient-to-r from-rose-100 via-pink-100 to-purple-100 hover:from-rose-200 hover:via-pink-200 hover:to-purple-200 text-purple-700 border border-purple-200 text-lg sm:text-xl py-4 rounded-xl transition">
            Clear Completed Tasks
        </button>

    </div>

    <script>

        function addTask() {

            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                document.getElementById("message").textContent =
                    "Please enter a task!";
                input.focus();
                return;
            }

            document.getElementById("message").textContent = "";

            let li = document.createElement("li");

            li.className =
                "flex items-center gap-3 p-4 rounded-xl border border-purple-100 bg-white/80 shadow-sm";

            let check = document.createElement("input");
            check.type = "checkbox";
            check.className = "w-5 h-5 accent-purple-600 shrink-0";

            let span = document.createElement("span");
            span.textContent = task;
            span.className = "flex-1 min-w-0 break-words text-gray-700";

            check.onchange = function () {

                if (check.checked) {
                    span.classList.add("line-through", "text-gray-400");
                } else {
                    span.classList.remove("line-through", "text-gray-400");
                }

                updateTasks();
            };

            let del = document.createElement("button");
            del.textContent = "Delete";
            del.className =
                "shrink-0 bg-gradient-to-r from-rose-400 to-red-500 hover:from-rose-500 hover:to-red-600 text-white px-3 py-2 rounded-lg";

            del.onclick = function () {
                li.remove();
                updateTasks();
            };

            li.appendChild(check);
            li.appendChild(span);
            li.appendChild(del);

            document.getElementById("taskList").appendChild(li);

            input.value = "";
            input.focus();

            updateTasks();
        }

        function updateTasks() {

            let tasks = document.querySelectorAll("#taskList li");
            let checkedTasks = document.querySelectorAll("#taskList input:checked");

            let total = tasks.length;
            let completed = checkedTasks.length;
            let pending = total - completed;

            document.getElementById("total").textContent = total;
            document.getElementById("completed").textContent = completed;
            document.getElementById("pending").textContent = pending;

            document.getElementById("emptyMessage").style.display =
                total === 0 ? "block" : "none";
        }

        function clearCompleted() {

            let completedTasks =
                document.querySelectorAll("#taskList input:checked");

            completedTasks.forEach(function (check) {
                check.closest("li").remove();
            });

            updateTasks();
        }

        document.getElementById("taskInput").addEventListener("keydown", function (event) {

            if (event.key === "Enter") {
                addTask();
            }

        });

    </script>

</body>

</html>
